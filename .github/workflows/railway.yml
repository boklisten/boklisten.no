name: Railway

on:
  push:
    branches: [main, production]
    paths: [".railway/**", ".github/workflows/railway.yml"]

permissions:
  contents: read

concurrency:
  group: railway-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    name: Apply ${{ github.ref_name == 'production' && 'production' || 'staging' }}
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'production' && 'production' || 'staging' }}
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: voidzero-dev/setup-vp@v1.21.1
        with:
          node-version-file: .node-version
          cache: true
          run-install: |
            - cwd: .
              args: ["--frozen-lockfile"]
      - name: Apply
        run: ./node_modules/.bin/railway config apply --yes
