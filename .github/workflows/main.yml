name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: voidzero-dev/setup-vp@v1.21.1
        with:
          node-version-file: .node-version
          cache: true
          run-install: |
            - cwd: .
              args: ["--frozen-lockfile"]
      - name: Format, lint and type check
        run: vp run check

  build_backend:
    name: Build Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: voidzero-dev/setup-vp@v1.21.1
        with:
          node-version-file: .node-version
          cache: true
          run-install: |
            - cwd: .
              args: ["--frozen-lockfile"]
      - name: Build Backend
        run: vp run build:backend

  build_frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: voidzero-dev/setup-vp@v1.21.1
        with:
          node-version-file: .node-version
          cache: true
          run-install: |
            - cwd: .
              args: ["--frozen-lockfile"]
      - name: Build Frontend
        run: vp run build:frontend

  test_backend:
    name: Test Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: voidzero-dev/setup-vp@v1.21.1
        with:
          node-version-file: .node-version
          cache: true
          run-install: |
            - cwd: .
              args: ["--frozen-lockfile"]
      - name: Test Backend
        run: vp run test
